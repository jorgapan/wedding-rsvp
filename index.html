<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding RSVP | Jorge & Inca</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #fdfbf7; 
            color: #333; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
        }
        .banner-container {
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto 20px auto; 
            text-align: center;
        }
        .banner-container img {
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 8px;
        }
        .card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: left;
        }
        h2 { color: #2c3e50; text-align: center; }
        p { color: #666; line-height: 1.5; text-align: center; }
        .btn { 
            display: inline-block; 
            background: #556b2f; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-size: 16px; 
            margin-top: 20px; 
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:hover { background: #455a26; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input[type="text"], select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Wedding Banner Image -->
    <div class="banner-container">
        <img src="wedding_rsvp_banner.png" alt="Jorge & Inca Wedding Banner">
    </div>

    <!-- Main RSVP Card Container -->
    <div class="card" id="card-container">
        <div id="loading" style="text-align: center; padding: 40px;">Loading your invitation...</div>
        
        <!-- Fallback view if scanned via QR without token -->
        <div id="fallback-view" class="hidden" style="text-align: center;">
            <h2 id="fb-title">You're Invited!</h2>
            <p id="fb-text">Please click below to fill out your RSVP form.</p>
            <a href="YOUR_GOOGLE_FORM_URL_HERE" class="btn" id="form-link" style="max-width: 300px;">Open RSVP Form</a>
        </div>

        <!-- Personalized RSVP Form View -->
        <div id="rsvp-form-view" class="hidden">
            <h2 id="welcome-title">Hola</h2>
            <p id="sub-title">We are excited to celebrate with you!</p>
            
            <form id="rsvpForm">
                <div class="form-group">
                    <label id="lbl-attending">Attending</label>
                    <div class="radio-group">
                        <label><input type="radio" name="attending" value="Yes" required> <span id="opt-yes">Yes, I'll be there</span></label>
                        <label><input type="radio" name="attending" value="No" required> <span id="opt-no">No, I can't make it</span></label>
                    </div>
                </div>

                <div class="form-group" id="plus-one-container">
                    <label id="lbl-plus-one">Will someone be accompanying you?</label>
                    <input type="text" id="plus_one_name" name="plus_one_name" placeholder="Guest Name">
                </div>

                <div class="form-group">
                    <label id="lbl-meal">Meal preference</label>
                    <select id="meal_preference" name="meal_preference">
                        <!-- Options will be populated dynamically based on language -->
                    </select>
                </div>

                <div class="form-group">
                    <label id="lbl-dietary">Dietary restrictions & allergies</label>
                    <textarea id="dietary" name="dietary" rows="3" placeholder="Let us know..."></textarea>
                </div>

                <button type="submit" class="btn" id="btn-submit">Submit RSVP</button>
            </form>
        </div>

        <!-- Success Message View -->
        <div id="success-view" class="hidden" style="text-align: center;">
            <h2 id="suc-title">Thank You!</h2>
            <p id="suc-text">Your response has been successfully recorded.</p>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXUH8ej3-l3_-jhrgGQZ_7IxX2-zp8aKzlVfAZZhApJN0g1gTmZkmVqsIFq_IuX-ho/exec';
    const GOOGLE_FORM_URL = 'YOUR_GOOGLE_FORM_URL_HERE'; // Fallback link if needed

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    let currentGuestData = {};

    // Dictionary of translations
    const i18n = {
        es: {
            welcome: (name) => `Hola ${name}`,
            sub: "¡Estamos muy emocionados de celebrar contigo!",
            attending: "Asistencia",
            yes: "Sí, confirmo",
            no: "No, no podré asistir",
            plusOne: "¿Vendrá alguien contigo?",
            plusOnePlaceholder: "Nombre del acompañante",
            meal: "Preferencia de comida",
            meals: [
                {val: "Carne", text: "Carne"},
                {val: "Pescado", text: "Pescado (Pescetariano)"},
                {val: "Vegetariano", text: "Vegetariano"}
            ],
            dietary: "Restricciones alimentarias y alergias",
            dietaryPlaceholder: "Cuéntanos si tienes alguna...",
            submit: "Enviar confirmación",
            successTitle: "¡Gracias!",
            successText: "Tu respuesta ha sido guardada exitosamente.",
            fbTitle: "¡Estás Invitado!",
            fbText: "Por favor haz clic abajo para completar tu confirmación.",
            fbBtn: "Abrir Formulario"
        },
        en: {
            welcome: (name) => `Hello ${name}`,
            sub: "We are excited to celebrate with you!",
            attending: "Attending",
            yes: "Yes, I'll be there",
            no: "No, I can't make it",
            plusOne: "Will someone be accompanying you?",
            plusOnePlaceholder: "Guest Name",
            meal: "Meal preference",
            meals: [
                {val: "Carne", text: "Meat"},
                {val: "Pescado", text: "Fish (Pescatarian)"},
                {val: "Vegetariano", text: "Vegetarian"}
            ],
            dietary: "Dietary restrictions & allergies",
            dietaryPlaceholder: "Let us know...",
            submit: "Submit RSVP",
            successTitle: "Thank You!",
            successText: "Your response has been successfully recorded.",
            fbTitle: "You're Invited!",
            fbText: "Please click below to fill out your RSVP form.",
            fbBtn: "Open RSVP Form"
        }
    };

    if (!token) {
        window.location.href = GOOGLE_FORM_URL;
    } else {
        fetch(`${SCRIPT_URL}?token=${token}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                if (data.status === 'success') {
                    currentGuestData = data.guest;
                    document.getElementById('rsvp-form-view').classList.remove('hidden');
                    
                    // Determine language from sheet (defaults to 'es' if column is blank or missing)
                    let lang = (data.guest.language || 'es').toLowerCase();
                    if (!i18n[lang]) lang = 'es'; 
                    const t = i18n[lang];

                    // Apply text based on chosen language
                    const guestName = data.guest.name || '';
                    document.getElementById('welcome-title').innerText = t.welcome(guestName);
                    document.getElementById('sub-title').innerText = t.sub;
                    document.getElementById('lbl-attending').innerText = t.attending;
                    document.getElementById('opt-yes').innerText = t.yes;
                    document.getElementById('opt-no').innerText = t.no;
                    document.getElementById('lbl-plus-one').innerText = t.plusOne;
                    document.getElementById('plus_one_name').placeholder = t.plusOnePlaceholder;
                    document.getElementById('lbl-meal').innerText = t.meal;
                    
                    // Populate meal options
                    const mealSelect = document.getElementById('meal_preference');
                    mealSelect.innerHTML = '';
                    t.meals.forEach(m => {
                        let opt = document.createElement('option');
                        opt.value = m.val;
                        opt.innerText = m.text;
                        mealSelect.appendChild(opt);
                    });

                    document.getElementById('lbl-dietary').innerText = t.dietary;
                    document.getElementById('dietary').placeholder = t.dietaryPlaceholder;
                    document.getElementById('btn-submit').innerText = t.submit;
                    
                    document.getElementById('suc-title').innerText = t.successTitle;
                    document.getElementById('suc-text').innerText = t.successText;

                    // Handle Plus One allowance visibility
                    const allowPlusOne = String(data.guest.allow_plus_one).toLowerCase() === 'true';
                    if (!allowPlusOne) {
                        document.getElementById('plus-one-container').style.display = 'none';
                    }
                } else {
                    document.getElementById('fallback-view').classList.remove('hidden');
                }
            })
            .catch(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback-view').classList.remove('hidden');
            });
    }

    // Handle form submission back to Apps Script
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const payload = {
            token: token,
            attending: document.querySelector('input[name="attending"]:checked').value,
            plus_one_name: document.getElementById('plus_one_name').value,
            meal_preference: document.getElementById('meal_preference').value,
            dietary: document.getElementById('dietary').value,
            status: 'Submitted'
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('rsvp-form-view').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');
            } else {
                alert('Error submitting RSVP. Please try again.');
            }
        })
        .catch(() => {
            alert('Connection error. Please try again.');
        });
    });
</script>

</body>
</html>
