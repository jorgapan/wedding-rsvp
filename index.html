<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding RSVP | Jorge & Inca</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #fdfbf7; 
            color: #333; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            text-align: center; 
        }
        .banner-container {
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto 20px auto; 
            text-align: center;
        }
        .banner-container img {
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 8px;
        }
        .card { 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: left;
        }
        h2 { color: #2c3e50; text-align: center; }
        p { color: #666; line-height: 1.5; text-align: center; }
        .btn { 
            display: inline-block; 
            background: #556b2f; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-size: 16px; 
            margin-top: 20px; 
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn:hover { background: #455a26; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input[type="text"], select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Wedding Banner Image -->
    <div class="banner-container">
        <img src="wedding_rsvp_banner.png" alt="Jorge & Inca Wedding Banner">
    </div>

    <!-- Main RSVP Card Container -->
    <div class="card" id="card-container">
        <div id="loading" style="text-align: center; padding: 40px;">Loading your invitation...</div>
        
        <!-- Fallback view if scanned via QR without token -->
        <div id="fallback-view" class="hidden" style="text-align: center;">
            <h2 id="fb-title">You're Invited!</h2>
            <p id="fb-text">Please click below to fill out your RSVP form.</p>
            <a href="YOUR_GOOGLE_FORM_URL_HERE" class="btn" id="form-link" style="max-width: 300px;">Open RSVP Form</a>
        </div>

        <!-- Personalized RSVP Form View -->
        <div id="rsvp-form-view" class="hidden">
            <h2 id="welcome-title">Hola</h2>
            <p id="sub-title">We are excited to celebrate with you!</p>
            
            <form id="rsvpForm">
                <div class="form-group">
                    <label id="lbl-attending">Attending</label>
                    <div class="radio-group">
                        <label><input type="radio" name="attending" value="Yes" required> <span id="opt-yes">Yes, I'll be there</span></label>
                        <label><input type="radio" name="attending" value="No" required> <span id="opt-no">No, I can't make it</span></label>
                    </div>
                </div>

                <div class="form-group" id="plus-one-container">
                    <label id="lbl-plus-one">Will someone be accompanying you?</label>
                    <input type="text" id="plus_one_name" name="plus_one_name" placeholder="Guest Name">
                </div>

                <div class="form-group">
                    <label id="lbl-dietary">Dietary preferences & restrictions</label>
                    <select id="dietary_preference" name="dietary_preference">
                        <!-- Populated dynamically via JS -->
                    </select>
                </div>

                <div class="form-group hidden" id="other-dietary-container">
                    <label id="lbl-other-dietary">Please specify:</label>
                    <textarea id="dietary_custom" name="dietary_custom" rows="2" placeholder="Describe restrictions or allergies..."></textarea>
                </div>

                <button type="submit" class="btn" id="btn-submit">Submit RSVP</button>
            </form>
        </div>

        <!-- Success Message View -->
        <div id="success-view" class="hidden" style="text-align: center;">
            <h2 id="suc-title">Thank You!</h2>
            <p id="suc-text">Your response has been successfully recorded.</p>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXUH8ej3-l3_-jhrgGQZ_7IxX2-zp8aKzlVfAZZhApJN0g1gTmZkmVqsIFq_IuX-ho/exec';
    const GOOGLE_FORM_URL = 'YOUR_GOOGLE_FORM_URL_HERE';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    let currentGuestData = {};

    const i18n = {
        es: {
            welcome: (name) => `Hola ${name}`,
            sub: "¡Estamos muy emocionados de celebrar contigo!",
            attending: "Asistencia",
            yes: "Sí, confirmo",
            no: "No, no podré asistir",
            plusOne: "¿Vendrá alguien contigo?",
            plusOnePlaceholder: "Nombre del acompañante",
            dietary: "Preferencia alimentaria y restricciones",
            dietaryOptions: [
                {val: "None", text: "Ninguna / None"},
                {val: "Pescatarian", text: "Pescetariano / Pescatarian"},
                {val: "Vegetarian", text: "Vegetariano / Vegetarian"},
                {val: "Vegan", text: "Vegano / Vegan"},
                {val: "Others", text: "Otros (especificar) / Others"}
            ],
            otherDietaryLabel: "Por favor especifica tus restricciones o alergias:",
            otherPlaceholder: "Cuéntanos detalles...",
            submit: "Enviar confirmación",
            successTitle: "¡Gracias!",
            successText: "Tu respuesta ha sido guardada exitosamente.",
            fbTitle: "¡Estás Invitado!",
            fbText: "Por favor haz clic abajo para completar tu confirmación.",
            fbBtn: "Abrir Formulario"
        },
        en: {
            welcome: (name) => `Hello ${name}`,
            sub: "We are excited to celebrate with you!",
            attending: "Attending",
            yes: "Yes, I'll be there",
            no: "No, I can't make it",
            plusOne: "Will someone be accompanying you?",
            plusOnePlaceholder: "Guest Name",
            dietary: "Dietary preferences & restrictions",
            dietaryOptions: [
                {val: "None", text: "None"},
                {val: "Pescatarian", text: "Pescatarian"},
                {val: "Vegetarian", text: "Vegetarian"},
                {val: "Vegan", text: "Vegan"},
                {val: "Others", text: "Others (specify)"}
            ],
            otherDietaryLabel: "Please specify restrictions or allergies:",
            otherPlaceholder: "Let us know details...",
            submit: "Submit RSVP",
            successTitle: "Thank You!",
            successText: "Your response has been successfully recorded.",
            fbTitle: "You're Invited!",
            fbText: "Please click below to fill out your RSVP form.",
            fbBtn: "Open RSVP Form"
        },
        de: {
            welcome: (name) => `Hallo ${name}`,
            sub: "Wir freuen uns sehr, mit Ihnen zu feiern!",
            attending: "Teilnahme",
            yes: "Ja, ich bin dabei",
            no: "Nein, ich kann leider nicht",
            plusOne: "Kommt jemand als Begleitung mit?",
            plusOnePlaceholder: "Name der Begleitperson",
            dietary: "Ernährungswünsche & Unverträglichkeiten",
            dietaryOptions: [
                {val: "None", text: "Keine / None"},
                {val: "Pescatarian", text: "Pescetarisch / Pescatarian"},
                {val: "Vegetarian", text: "Vegetarisch / Vegetarian"},
                {val: "Vegan", text: "Vegan / Vegan"},
                {val: "Others", text: "Sonstige (bitte angeben) / Others"}
            ],
            otherDietaryLabel: "Bitte genaue Einschränkungen oder Allergien angeben:",
            otherPlaceholder: "Teilen Sie uns Details mit...",
            submit: "Zusage absenden",
            successTitle: "Vielen Dank!",
            successText: "Ihre Antwort wurde erfolgreich gespeichert.",
            fbTitle: "Sie sind eingeladen!",
            fbText: "Bitte klicken Sie unten, um das RSVP-Formular auszufüllen.",
            fbBtn: "Formular öffnen"
        }
    };

    if (!token) {
        window.location.href = GOOGLE_FORM_URL;
    } else {
        fetch(`${SCRIPT_URL}?token=${token}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                if (data.status === 'success') {
                    currentGuestData = data.guest;
                    document.getElementById('rsvp-form-view').classList.remove('hidden');
                    
                    let lang = (data.guest.language || 'es').toLowerCase();
                    if (!i18n[lang]) lang = 'es'; 
                    const t = i18n[lang];

                    const guestName = data.guest.name || '';
                    document.getElementById('welcome-title').innerText = t.welcome(guestName);
                    document.getElementById('sub-title').innerText = t.sub;
                    document.getElementById('lbl-attending').innerText = t.attending;
                    document.getElementById('opt-yes').innerText = t.yes;
                    document.getElementById('opt-no').innerText = t.no;
                    document.getElementById('lbl-plus-one').innerText = t.plusOne;
                    document.getElementById('plus_one_name').placeholder = t.plusOnePlaceholder;
                    
                    document.getElementById('lbl-dietary').innerText = t.dietary;
                    const dietarySelect = document.getElementById('dietary_preference');
                    dietarySelect.innerHTML = '';
                    t.dietaryOptions.forEach(optData => {
                        let opt = document.createElement('option');
                        opt.value = optData.val;
                        opt.innerText = optData.text;
                        dietarySelect.appendChild(opt);
                    });

                    document.getElementById('lbl-other-dietary').innerText = t.otherDietaryLabel;
                    document.getElementById('dietary_custom').placeholder = t.otherPlaceholder;
                    document.getElementById('btn-submit').innerText = t.submit;
                    
                    document.getElementById('suc-title').innerText = t.successTitle;
                    document.getElementById('suc-text').innerText = t.successText;

                    const allowPlusOne = String(data.guest.allow_plus_one).toLowerCase() === 'true';
                    if (!allowPlusOne) {
                        document.getElementById('plus-one-container').style.display = 'none';
                    }
                } else {
                    document.getElementById('fallback-view').classList.remove('hidden');
                }
            })
            .catch(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback-view').classList.remove('hidden');
            });
    }

    // Toggle custom text box if "Others" is selected
    document.getElementById('dietary_preference').addEventListener('change', function() {
        const otherContainer = document.getElementById('other-dietary-container');
        if (this.value === 'Others') {
            otherContainer.classList.remove('hidden');
        } else {
            otherContainer.classList.add('hidden');
            document.getElementById('dietary_custom').value = '';
        }
    });

    // Handle form submission and concatenate strings into 'dietary'
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const pref = document.getElementById('dietary_preference').value;
        const customText = document.getElementById('dietary_custom').value.trim();
        
        let finalDietary = pref;
        if (pref === 'Others' && customText) {
            finalDietary = `Others: ${customText}`;
        }

        const payload = {
            token: token,
            attending: document.querySelector('input[name="attending"]:checked').value,
            plus_one_name: document.getElementById('plus_one_name').value,
            dietary: finalDietary,
            status: 'Submitted'
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('rsvp-form-view').classList.add('hidden');
                document.getElementById('success-view').classList.remove('hidden');
            } else {
                alert('Error submitting RSVP. Please try again.');
            }
        })
        .catch(() => {
            alert('Connection error. Please try again.');
        });
    });
</script>

</body>
</html>
